# Build the control-plane image; push to GHCR on main and version tags.
#
# PRs build (proving the Dockerfile) but never push. Images land at
# ghcr.io/<owner>/<repo>, tagged: `latest` (default branch), `sha-<short>`,
# and semver tags for releases (`v1.2.3` → 1.2.3, 1.2, latest).
# Auth is the built-in GITHUB_TOKEN — no PAT to provision or rotate.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache backend: with cargo-chef in the
          # Dockerfile, a src-only change reuses the whole dependency layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
