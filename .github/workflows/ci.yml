# Tests on every push/PR — including the full integration suite, which gets
# a real throwaway Postgres 18 as a service container (the same contract as
# local: CRYPTARCH_TEST_DSN pointing at a superuser that can CREATE DATABASE).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Before cargo, so the binary embeds and tests serve the REAL frontend
      # build rather than build.rs's placeholder (CRYPTARCH-129).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend (type-check, unit tests, build)
        working-directory: frontend
        run: npm ci && npm run check && npm test && npm run build
      - name: cargo test (unit + integration)
        env:
          CRYPTARCH_TEST_DSN: postgres://postgres:ci@localhost:5432/postgres
        run: cargo test --all-targets
