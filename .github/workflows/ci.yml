# Tests on every push/PR — including the full integration suite, which gets
# a real throwaway Postgres 18 as a service container (the same contract as
# local: CRYPTARCH_TEST_DSN pointing at a superuser that can CREATE DATABASE).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (unit + integration)
        env:
          CRYPTARCH_TEST_DSN: postgres://postgres:ci@localhost:5432/postgres
        run: cargo test --all-targets
