[package]
name = "cryptarch"
version = "0.1.0"
edition = "2021"
description = "Self-service, multi-engine, multi-server database provisioning portal"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie", "form"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
# PgBouncer's admin console speaks only the simple query protocol; sqlx's
# prepared statements break on it. tokio-postgres has simple_query.
tokio-postgres = "0.7"
# Client-side SCRAM verifier computation so plaintext passwords never travel
# in DDL (they'd land in the managed server's statement logs otherwise).
postgres-protocol = "0.6"
# Checksum header on rendered edge config, for drift detection.
sha2 = "0.10"
# Health notifications (CRYPTARCH-43): ntfy / webhook delivery.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
maud = { version = "0.26", features = ["axum"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
