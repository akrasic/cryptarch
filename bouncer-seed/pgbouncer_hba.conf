# Cryptarch edge — initial hba: console access only, everything else denied.
# Cryptarch's renderer (CRYPTARCH-12) replaces this file; do not hand-edit
# the volume copy — changes will be overwritten and flagged as drift.
#
# This file is in force from `docker compose up` until the operator completes
# "Run server init" (README step 4), so it has to match what the renderer will
# produce (CRYPTARCH-104) — otherwise the window before the first edge sync is
# exactly the window in which the hardening does not apply.
#
# Two console users, not one: `auth_type = hba` means this file governs
# authentication to the virtual `pgbouncer` database, and `stats_users` is
# authorisation applied AFTER auth rather than a bypass of it. With only the
# pgbadmin line the metrics exporter cannot log in at all.
#
# The addresses are the stack-internal `backend` subnet. They are NOT
# 0.0.0.0/0, which is what shipped here before: the bouncer also sits on the
# attachable `db` network where tenant containers live, so an open console rule
# handed every tenant app RELOAD/KILL/SHUTDOWN over the edge all of them share.
# Keep in step with BACKEND_NETWORK_SUBNET / CRYPTARCH_CONSOLE_CIDR.
host pgbouncer pgbadmin 172.19.0.0/16 scram-sha-256
host pgbouncer pgbstats 172.19.0.0/16 scram-sha-256
